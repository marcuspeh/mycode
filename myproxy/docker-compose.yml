version: "3.9"

services:
  myproxy:
    build: .
    container_name: myproxy
    restart: unless-stopped
    ports:
      - "3566:3566"
    environment:
      - MINIMAX_API_KEYS=${MINIMAX_API_KEYS:-}
      - DEEPSEEK_API_KEYS=${DEEPSEEK_API_KEYS:-}
    env_file:
      - .env
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3566/health"]
      interval: 30s
      timeout: 10s
      retries: 3
